<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kodo — apprendre l’algorithmique, de la première ligne aux Olympiades</title>
    <meta name="description" content="Des cours courts et des problèmes corrigés en direct pour apprendre Python et le C++, du premier print aux Olympiades d'informatique." />
    <meta name="theme-color" content="#17171c" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      // Liens profonds sur GitHub Pages : le 404.html du site renvoie ici avec ?chemin=…
      ;(function () {
        var q = new URLSearchParams(location.search)
        var p = q.get('chemin')
        if (p) history.replaceState(null, '', p)
        try {
          var t = localStorage.getItem('kodo:theme')
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
