# Déploiement Render (site statique). Le rewrite corrige les liens profonds
# (/connexion, /app/planning…) qui renvoyaient « Not Found » sur l'ancienne version.
services:
  - type: web
    name: swimhub-connect
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
