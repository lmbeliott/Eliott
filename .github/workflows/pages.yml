# Reconstruit les deux sites et les publie sur la branche gh-pages (GitHub Pages) :
# SwimHub à la racine (/Eliott/), Kodo dans /Eliott/kodo/.
name: Déployer sur GitHub Pages

on:
  push:
    branches: [claude/serene-cannon-dayh0p, claude/zen-bell-zzyo9l, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            kodo/package-lock.json
      - run: npm ci
      - name: Construire Kodo (vérifie aussi chaque problème avec Python et g++)
        if: hashFiles('kodo/package.json') != ''
        working-directory: kodo
        env:
          VITE_BASE: /Eliott/kodo/
        run: |
          npm ci
          npm run build
      - run: npm run build:pages
      - name: Publier dist/ sur gh-pages
        working-directory: dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Déploiement ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
